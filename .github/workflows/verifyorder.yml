name: Verify order pipeline

on:
  push:
    paths:
      - ".github/workflows/verifyorder.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install a browser
        run: npm i -D playwright@1.49.0 && npx playwright install chromium --with-deps

      - name: Submit the form the way a customer browser would
        run: |
          cat > form.html <<'HTML'
          <form id="f" action="https://formsubmit.co/rootsrevivalpakistan@gmail.com" method="POST">
            <input name="_subject" value="Roots Revival website setup check">
            <input name="_captcha" value="false">
            <input name="_template" value="box">
            <textarea name="message">Automated setup check from the new Roots Revival website. Please confirm the activation email so order emails start arriving.</textarea>
          </form>
          HTML
          cat > run.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage();
            await p.goto('file://' + process.cwd() + '/form.html');
            await p.evaluate(() => document.getElementById('f').submit());
            await p.waitForTimeout(15000);
            console.log('FINAL URL:', p.url());
            console.log('TITLE:', await p.title());
            const text = (await p.evaluate(() => document.body.innerText)).slice(0, 1200);
            console.log('BODY:', text);
            await b.close();
          })();
          JS
          node run.js
